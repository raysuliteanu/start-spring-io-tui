name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; advisory warnings (unsound/unmaintained) are
      # reported in the log only.
      - run: cargo audit
