[package]
name = "start-spring-io-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
minijinja = { version = "3.1.0", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[build-dependencies]
vergen-gix = { version = "10.0.4", features = ["build", "rustc"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
mockito = "1.7.2"
regex = "1.13.2"
tempfile = "3.27.0"
